name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chitra
          POSTGRES_PASSWORD: chitra
          POSTGRES_DB: chitra_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test settings force IMAGE_PROVIDER=stub, so CI never calls Hugging Face
      # and no real token is needed here.
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-key-not-used-for-anything-real-0123456789
      DATABASE_URL: postgres://chitra:chitra@localhost:5432/chitra_ai_test
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real Hugging Face token is committed
        run: |
          # The placeholder in .env.example is hf_xxxx..., which this skips.
          if git grep -nIE 'hf_[A-Za-z0-9]{30,}' -- . ':!*.example' ; then
            echo "::error::A Hugging Face token appears to be committed."
            exit 1
          fi
          echo "No committed Hugging Face token found."

      - name: Fail if an environment file is tracked
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env is tracked. It must stay gitignored."
            exit 1
          fi
          echo "No tracked environment file."
