# Chitra AI - nginx location blocks for CloudPanel.
#
# CloudPanel owns the vhost for chitra-ai.devtechguru.cloud, so this is NOT a
# standalone site file. Paste the two blocks below into:
#
#   CloudPanel -> Sites -> chitra-ai.devtechguru.cloud -> Vhost
#
# They must go ABOVE the existing "location /" block that CloudPanel generated
# (nginx picks the longest matching prefix, but keeping them first also keeps
# the file readable). Leave everything else CloudPanel wrote alone -- it owns
# the TLS block, the listen directives, and the reverse proxy to 127.0.0.1:8021.

# --- Generated images ------------------------------------------------------
# Served straight off disk rather than through gunicorn. Each file is addressed
# by a random 32-hex key, so the URL is the capability; directory listing stays
# off so the keys cannot be enumerated.
location /media/ {
    alias /home/chitra-ai/htdocs/chitra-ai.devtechguru.cloud/backend/media/;
    autoindex off;

    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;

    # The Vercel frontend fetches these into a blob so the download can carry a
    # meaningful filename. Without this header the browser navigates to the
    # image instead of saving it.
    add_header Access-Control-Allow-Origin "https://chitra-ai.technicalbind.com" always;
    add_header Vary "Origin" always;

    # Nothing under /media/ is ever executable.
    location ~* \.(php|py|sh|cgi|pl)$ {
        return 404;
    }
}

# --- Django admin static files --------------------------------------------
location /static/ {
    alias /home/chitra-ai/htdocs/chitra-ai.devtechguru.cloud/backend/staticfiles/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# --- Generation rate limit (optional) --------------------------------------
# Image generation is slow and costs money upstream, so it is capped at the
# edge as well as inside Django. To use this, first add the zone to the http{}
# block in /etc/nginx/nginx.conf:
#
#   limit_req_zone $binary_remote_addr zone=chitra_generate:10m rate=30r/m;
#
# then uncomment the block below. Without the zone directive nginx will refuse
# to start, so do not enable one without the other.
#
# location /api/images/generate/ {
#     limit_req zone=chitra_generate burst=5 nodelay;
#     proxy_pass http://127.0.0.1:8021;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_read_timeout 180s;
#     proxy_send_timeout 180s;
# }

# --- Note on timeouts ------------------------------------------------------
# A cold FLUX model can take well over a minute. CloudPanel's default
# proxy_read_timeout is 60s, which would return 504 before the image is ready.
# In the same Vhost editor, raise it on the main "location /" block:
#
#   proxy_read_timeout 180s;
#   proxy_send_timeout 180s;
